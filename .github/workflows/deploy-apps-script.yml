name: Deploy to Google Apps Script

on:
  # Deploy after every push to main, regardless of which client created it.
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Validate deployment settings
        shell: bash
        env:
          CLASP_TOKEN: ${{ secrets.CLASP_TOKEN }}
          CLASP_DEPLOYMENT_ID: ${{ vars.CLASP_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLASP_TOKEN" ]]; then
            echo "::error title=Missing CLASP_TOKEN::Add the CLASP_TOKEN repository secret before running this workflow."
            exit 1
          fi
          if [[ -z "$CLASP_DEPLOYMENT_ID" ]]; then
            echo "::error title=Missing CLASP_DEPLOYMENT_ID::Add the CLASP_DEPLOYMENT_ID repository variable before running this workflow."
            exit 1
          fi
          if [[ ! -f .clasp.json ]]; then
            echo "::error title=Missing .clasp.json::.clasp.json was not found at the repository root."
            exit 1
          fi

      - name: Authenticate clasp
        shell: bash
        env:
          CLASP_TOKEN: ${{ secrets.CLASP_TOKEN }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$HOME/.clasprc.json"
          printf '%s' "$CLASP_TOKEN" > "$HOME/.clasprc.json"

      - name: Push code to Apps Script
        run: clasp push --force

      - name: Deploy new version (same /exec URL)
        shell: bash
        env:
          CLASP_DEPLOYMENT_ID: ${{ vars.CLASP_DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          clasp deploy \
            -i "$CLASP_DEPLOYMENT_ID" \
            -d "Auto-deploy from GitHub Actions ${GITHUB_SHA:0:7}"
